name: Daily Berlin Job Applier & CV Tailor (Cloud Automation)

on:
  schedule:
    # 08:20 Europe/Berlin (CET) - Morning Run: Scrapes + Refreshes Dashboard + Sends 1 Daily Morning Email Digest
    - cron: "20 7 * * *"
    # 14:20 Europe/Berlin (CET) - Afternoon Run: Silent feed refresh & pruning (no email)
    - cron: "20 13 * * *"
    # 20:20 Europe/Berlin (CET) - Evening Run: Silent feed refresh & pruning (no email)
    - cron: "20 19 * * *"
  workflow_dispatch:
    inputs:
      scrape:
        description: "Scrape fresh jobs from LinkedIn & Indeed (true/false)"
        required: false
        default: "true"
      send_email:
        description: "Send email digest to inboxes (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  job-applier:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      JOB_DASHBOARD_URL: "https://guillermohern023.github.io/berlin-job-applier/"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium & Fonts for Headless PDF Printing
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Job Scrape, CV Tailor & Email Digest
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.scrape }}" = "false" ]; then
            ARGS="$ARGS --no-scrape"
          else
            ARGS="$ARGS --scrape"
          fi

          # Exactly 1 email a day: Send email ONLY on the 08:20 Berlin morning schedule
          # All other runs (afternoon, evening, manual workflow_dispatch) are silent by default
          if [ "${{ github.event_name }}" = "schedule" ]; then
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" = "07" ] || [ "$UTC_HOUR" = "06" ]; then
              echo ">> Morning schedule (08:20 CET): Sending exactly 1 daily morning digest email."
              ARGS="$ARGS --morning-digest"
            else
              echo ">> Afternoon/Evening schedule: Silent feed refresh (no email)."
              ARGS="$ARGS --no-email"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.send_email }}" = "true" ]; then
              echo ">> Manual on-demand run: Explicitly requested email digest."
              ARGS="$ARGS --send-email"
            else
              echo ">> Manual on-demand run: Updating dashboard silently (no email)."
              ARGS="$ARGS --no-email"
            fi
          fi

          python daily_job_digest.py $ARGS

      - name: Commit & Push Updated Jobs, Tailored PDFs & Dashboard
        run: |
          git config user.name "Antigravity Job Applier Bot"
          git config user.email "guillejhl@gmail.com"
          git add data/ output/ docs/ latest_job_digest.txt dashboard.html
          git diff --staged --quiet || (git commit -m "chore(jobs): automated daily scrape, CV tailor & dashboard update [skip ci]" && git push)
